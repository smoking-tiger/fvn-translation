title: "Sam & Max: Save the World"
kr_title: "샘과 맥스: 세상을 구하다"
desc: |
  샘은 정의를 사랑하는 키 180cm의 개 탐정이다. 맥스는 난장판을 벌이는 데 사족을 못 쓰는, 잠시도 가만있지 못하는 토끼 비슷한 생명체다. 이 둘이 바로 프리랜서 경찰 콤비다. 그리고 이제, 이들이 세상을 구하려 한다.

  ### 돌아와서 반가워, 꼬마 친구!

  2006년, 만화책 속 범죄 소탕 콤비 샘과 맥스는 텔테일 최초의 본격적인 에피소드형 게임에 주인공으로 등장했다. 텔테일은 훗날 《The Walking Dead》와 《Batman: The Enemy Within》을 제작하게 되는 게임 개발사다.
  이제 모두가 사랑하는 개와 토끼 비슷한 생명체가 《샘과 맥스: 세상을 구하라 리마스터》로 돌아왔다. 샘과 맥스의 첫 번째 에피소드형 게임 시즌을 새롭게 단장한 작품으로, 원작자 스티브 퍼셀의 축복 아래 원작 개발진 일부가 모여 애정을 듬뿍 담아 완성했다.
  한때 '게임계 최초의 시트콤'이라 불렸고, 이제는 '기다리고 있었다는 사실조차 몰랐던 리마스터'라는 찬사를 받는 어드벤처 게임으로 다시 돌아가 보자. 향상된 그래픽, 새롭게 지원하는 와이드스크린과 게임패드, 다섯 곡의 새로운 음악은 물론, 과거 IGN 올해의 최고 어드벤처 게임상을 안겨 준 기발한 퍼즐과 엉뚱한 유머까지 고스란히 담았다. 《샘과 맥스: 세상을 구하라 리마스터》는 처음 플레이하든 다시 플레이하든 푹 빠져들게 될 현대의 고전이다.

  ### 자, 이제 세상을 구하러 가 볼까...

  자칭 프리랜서 경찰 콤비인 샘과 맥스에게는 여느 때와 다름없는 평범한 사무실의 하루다. 그러던 중 경찰국장에게서 심상치 않은 전화가 걸려 온다. 왕년의 아역 스타들이 길거리에서 난동을 부리고 있다는 것이다!
  멍청한 기물 파손 사건 하나쯤은 금방 해결될 줄 알았건만, 사건은 걷잡을 수 없는 거대한 음모로 번져 나간다. 샘과 맥스가 마주치는 불량배마다 알 수 없는 이유로 최면에 걸려 있기 때문이다. (눈동자가 빙글빙글 돌아가는 걸 보면 딱 알 수 있다.)
  이 수상한 범죄 행각의 배후는 누구이며, 대체 어떤 사악한 음모를 꾸미고 있는 걸까? 사건을 해결하려면 샘의 날카로운 탐정 감각과 맥스의 눈곱만큼도 없는 양심, 온갖 잡동사니는 물론 이웃인 시빌 팬데믹, 보스코, 이빨 두 개 지미의 도움까지 필요하다.
  샘과 맥스의 동네에서 시작해 백악관 앞 잔디밭을 거쳐 인터넷 속으로, 끝내 달까지 이어지는 이 기묘한 수수께끼는 진상이 드러날수록 더욱 황당하고 우스꽝스럽게 흘러간다.

