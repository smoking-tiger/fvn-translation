title: "Sam & Max: Save the World"
kr_title: "샘 앤 맥스: 세상을 구하다"
desc: |
  ### 샘은 정의를 사랑하는 키 180cm의 개 탐정이다. 맥스는 난장판을 벌이는 데 사족을 못 쓰는, 잠시도 가만있지 못하는 토끼 비슷한 생명체다. 이 둘이 바로 프리랜서 경찰 콤비다. 그리고 이제, 이들이 세상을 구하려 한다.

  개 탐정 샘과 말썽꾸러기 토끼 맥스는 기상천외한 사건을 해결하는 프리랜서 경찰 콤비다.

  어느 날, 거리에서 난동을 부리는 왕년의 아역 스타들을 조사하던 두 사람은 이들이 누군가에게 최면을 당했다는 사실을 알아낸다. 단순한 소동으로 시작된 수사는 방송계와 범죄 조직, 정부와 인터넷을 거쳐 달에까지 이르는 거대한 음모로 번져 간다.

  과연 샘과 맥스는 이 수상한 최면 사건의 배후를 밝혀내고 세상을 구할 수 있을까?

