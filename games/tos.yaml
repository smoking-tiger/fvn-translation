changelog: |
  이후 업데이트 버전은 DC인사이드 점퍼 갤러리의 파마도 님께서 추가로 패치를 진행하셔, 패치 링크를 변경했습니다.

  #### r5 (2025-06-08)

  - 각종 번역 누락 및 이슈 수정
  - 한글 조사가 제대로 작동하지 않는 경우를 수정했습니다

  #### r4 (2025-06-07)

  - 각종 번역 이슈 수정
  - 이전 한패에서 저장한 세이브 파일을 새 게임을 시작한 이후에 로드할때는 게임을 다시 시작하셔야 로드가 됩니다.
  - 원소 부여 시 크래시나는 현상을 수정하였습니다.

  #### r3 (2025-06-06)

  - 각종 번역 이슈 수정

  #### r2 (2025-06-05)

  - 갤러리, 이름 미설정의 경우 에러가 나는 현상 수정
  - 대부분의 이름 통일, 독백체 개선 등 수정

  #### r1 (2025-06-04)

  - 한글 패치(AI번역본) 배포
