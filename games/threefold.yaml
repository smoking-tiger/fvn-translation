title: Threefold Recital
kr_title: 삼상기담
desc: |
  《삼상기담》은 동양 판타지 세계를 배경으로, 오랜 황금기를 지나 혼란에 휩싸인 대도시 블루스케일스의 이야기를 그립니다. 마법과 현대 기술, 고대 기술이 뒤섞이면서 도시의 통치 체계는 새로운 도전에 직면하고, 인간과 수인, 용족 사이의 갈등은 점점 깊어져 갑니다. 그리고 그 이면에서는 거대한 위기가 서서히 다가오고 있습니다...

