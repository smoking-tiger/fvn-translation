status: 콘텐츠 경고
status_note: |
  이 게임에는 노골적인 노출, 성적 묘사, 제한적인 유혈 표현을 포함한 폭력적이고 선정적인 콘텐츠 및 성인 테마가 포함되어 있습니다.
  이 게임의 이야기는 전형적인 스토리텔링 방식이 아니며, 여러 번 플레이하는 것이 최고의 경험을 제공하도록 설계되어 있습니다.
  이 이야기의 등장인물은 진행에 따라 죽을 수 있으며, 실제로 죽습니다. 누가, 어떻게, 왜 죽는지는 당신의 선택과 플레이 방식에 따라 달라집니다.
  본 작품의 비밀번호는 게임의 핵심 스포일러이기 때문에, 비밀번호를 공개적으로 공유하는건 자제해주시길 바랍니다.
  본 작품은 "베타" 상태로 개발이 완료된 상태입니다. 일부 아트워크가 제대로 표시되지않거나, 미완성인 부분이 존재합니다.
