title: War of the Western Deep
kr_title: 웨스턴 딥의 전쟁
desc: |
  《웨스턴 딥의 전쟁》은 고전적인 스토리 중심 어드벤처와 영화 같은 전투 시스템을 결합한 게임입니다. 아름다운 수작업 애니메이션과 웅장한 오케스트라 음악, 개성 넘치는 캐릭터들의 생생한 음성 연기가 모험에 생동감을 불어넣습니다.

  평화로운 선즈그로브 왕국에 전쟁의 그림자가 드리우고 있습니다. 북쪽의 이웃 왕국이 비밀리에 침공을 준비하는 가운데, 국왕은 당신에게 중대한 서신을 전달하라는 명령을 내립니다. 왕실 전령 미렌이 된 당신은 오직 지혜와 한 자루의 검에 의지한 채, 국경을 넘어 낯선 땅으로 긴 여정을 떠납니다. 그 목적지는 거친 야생이 펼쳐진 변경 해안 지대입니다.

  마을 사람들은 당신을 믿지 않고, 울창한 숲속에는 도적과 괴물들이 도사리고 있습니다. 전쟁을 목전에 둔 낯선 왕국에서, 당신은 그저 편지 한 통을 들고 온 전령에 불과합니다.

