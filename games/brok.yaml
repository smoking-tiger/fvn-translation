title: BROK the InvestiGator
kr_title: 브록 더 인베스티게이터
desc: |
  "Brok"은 액션, 퍼즐이 포함된 독창적인 서사 중심의 추리 게임입니다.
  당신은 이 게임에서 머리를 써서 해결할 수도... 아니면 힘을 써서 모든 걸 해결할 수도 있습니다.

  이 미래의 "라이트 사이버 펑크" 세계에서는 인간 대신 동물들이 주류 종족으로 살아가고 있습니다.
  특권을 누리는 일부 시민들은 공기 오염으로부터 안전한 돔 안에서 살지만,
  다른 이들은 돔 밖에서 오늘도 살아가기 위해 고군분투합니다.
  사설 탐정이자, 전직 복서인 브록은 사별한 아내의 아들인 그래프와 함께 살고 있습니다.
  여태까지 브록은 사별한 아내의 사고에 숨겨진 진실을 밝혀내지는 못했지만,
  최근 일어난 사건들은 이 비극에 대한 실마리를 가리키고 있을지도 모릅니다.
  과연 이들은 이 광악하고 비극적인 세계에서 위협을 견디고 자신들의 운명에 맞설 수 있을까요?

