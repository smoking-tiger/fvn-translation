title: "Sam & Max: Beyond Time and Space"
kr_title: "샘 앤 맥스: 시공간을 넘어"
desc: |
  ### 북극에서 젊음의 샘까지, 우주에서 지옥을 거쳐 다시 돌아오기까지! 프리랜서 경찰 콤비와 함께 기상천외한 모험을 떠나 보자.

  프리랜서 경찰 샘과 맥스에게 이번에도 황당한 사건들이 밀려든다.
  난동을 부리는 산타클로스, 폭발 직전의 거대한 화산, 수상한 유럽 출신 흡혈귀까지! 두 사람은 기묘한 사건들을 해결하며 북극에서 열대의 섬으로, 우주에서 지옥까지 종횡무진 누빈다.
  그러나 사건이 거듭될수록 예상치 못한 위험이 다가오고, 소중한 친구들을 구하기 위해 두 사람은 자신의 영혼까지 걸어야 하는 상황에 놓인다.

status: 후속작
