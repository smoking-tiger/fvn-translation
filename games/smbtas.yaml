title: "Sam & Max: Beyond Time and Space"
kr_title: "샘 앤 맥스: 시공간을 넘어"
desc: |
  ### 북극에서 젊음의 샘까지, 우주에서 지옥을 거쳐 다시 돌아오기까지! 프리랜서 경찰 콤비와 함께 기상천외한 모험을 떠나 보자.

  《샘 앤 맥스: 시간과 공간을 넘어서》는 텔테일의 에피소드형 게임 《샘 앤 맥스》 시즌 2를 리마스터한 작품으로, 원작 개발진 일부가 소규모 팀을 꾸려 애정을 듬뿍 담아 새롭게 단장했다. 샘은 정의를 좇는 날카로운 후각을 지닌 키 180cm의 개 탐정이다. 맥스는 난장판을 벌이는 데 사족을 못 쓰는, 잠시도 가만있지 못하는 토끼 비슷한 생명체다. 이 둘이 바로 프리랜서 경찰 콤비다. 기상천외한 방식으로 범죄를 소탕하는 이 불손한 코미디 콤비는 30년 넘게 만화와 비디오 게임 팬들에게 웃음을 선사해 왔다.

  서로 연결된 다섯 개의 에피소드에서 샘과 맥스는 다시 범죄 소탕에 나선다. 산타클로스와 맞서 싸우고, 거대한 화산을 잠재우기 위해 시간과의 싸움을 벌이고, 허세 가득한 유럽산 뱀파이어와 대결한다. 그런데 이건 시작에 불과하다. 이야기는 갈수록 더 기묘해진다.

  피해망상에 시달리는 가게 주인 보스코가 떠들어 대는 거대한 음모는 과연 사실일까? 식당 주인 스팅키는 자신과 이름이 같은 할아버지 스팅키에게 일어난 일의 진실을 숨기고 있는 걸까? 엉뚱하고 변덕스러운 이웃 시빌 팬데믹은 과연 진정한 사랑을 찾을 수 있을까? 잠깐, 누가 방금... 생일이라고 했어?!
  데소토에 올라타고 웃음이 끊이지 않는 모험을 떠나 보자! 처음 출시됐을 당시 IGN 올해의 어드벤처 게임상을 수상했던 이 작품이 이제 그 어느 때보다 멋진 모습과 사운드로 돌아왔다. 눈부신 HD 그래픽, 전면 개선된 조명과 입 모양 애니메이션, 더욱 세련된 영상 연출, 리마스터된 음향은 물론, 재즈 연주자들이 직접 참여한 여덟 곡의 새로운 음악까지 만나 볼 수 있다.

  좀비들은 춤을 추고, 마리아치 악단은 노래를 부르고, 거대한 전투 로봇은 거리를 쑥대밭으로 만든다. 그리고 친구들의 목숨이 위태로워진 순간, 샘과 맥스는 모든 것을 바로잡기 위해 자신의 영혼마저 기꺼이 걸 것이다.

