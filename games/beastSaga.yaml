title: Beast Saga
kr_title: 영수강호
desc: |
  《영수강호》는 무협 세계를 배경으로 한 오픈 월드 RPG로, 당신은 늑대 부족의 젊은 일원인 구사가 되어 모험을 펼치게 됩니다. 자유로운 탐험과 채집, 제작, 생활 기술, 무공 수련, 세력 간의 동맹 등 다양한 활동을 즐기며, 강호에서 펼쳐지는 특별한 모험을 경험해 보세요.

