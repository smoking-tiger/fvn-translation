title: "Sam & Max: The Devil's Playhouse"
kr_title: "샘 앤 맥스: 악마의 놀이터"
desc: |
  ### 고대의 끔찍한 힘이 깨어날 때를 기다리고 있다...

  어느 날, 프리랜서 경찰 맥스는 미래를 내다볼 수 있는 신비한 장난감을 손에 넣고 초능력을 얻게 된다.
  하지만 이 장난감은 우주 곳곳의 악당들이 노리는 강력한 유물 중 하나였다. 샘과 맥스는 장난감에 숨겨진 비밀을 파헤치며 외계의 침략자와 초자연적인 존재들에 맞서게 된다.
  미래를 보고, 마음을 읽고, 공간을 넘나드는 맥스의 능력이 점점 강해지는 가운데, 두 사람은 그 어떤 적보다 위험한 존재와 마주하게 된다. 바로 맥스 자신의 정신이다.

