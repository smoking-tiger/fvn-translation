title: "Sam & Max: The Devil's Playhouse"
kr_title: "샘과 맥스: 악마의 극장"
desc: |
  ### 고대의 끔찍한 힘이 깨어날 때를 기다리고 있다...

  맥스는 언제나 프리랜서 경찰 콤비 중에서도 더 정신 나간 쪽이었다. 가는 곳마다 혼란을 몰고 다니는 데 천부적인 재능을 지닌, 미워할 수 없는 미치광이 말이다. 하지만 최근 들어 그의 능력은 초자연적인 영역으로까지 뻗어 나가기 시작했다.
  모든 일은 맥스가 미래를 엿볼 수 있게 해 주는 수수께끼의 장난감을 우연히 발견하면서 시작됐다. 이제 샘과 맥스는 자신들의 목적을 이루기 위해 마법의 힘이 깃든 '힘의 장난감'을 손에 넣으려는 은하계 곳곳의 온갖 악당들에게 주목받게 되었다.
  '악마의 장난감 상자'를 노리는 자들이 점점 가까워지고, 맥스의 초능력마저 통제할 수 없을 정도로 강해지는 가운데, 프리랜서 경찰 콤비는 지금껏 마주한 적 없는 가장 무시무시한 적과 맞서게 된다.

  바로 맥스 자신의 정신이 지닌 힘이다.

