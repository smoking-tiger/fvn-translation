title: Where the demon lurks
kr_title: 악마가 도사리는 곳
desc: |
  지하세계에서 추방된 전직 마왕은 키블턴이라는 한적한 마을에 숨어 지내고 있다. 자신의 운명을 받아들이고 조용히 살아가려 하지만, 천상계와 지하세계를 지배하는 세력들은 아직 그를 가만히 내버려 둘 생각이 없다.
  그토록 바라던 평화가 깨져 버린 지금, 이 악마는 과연 어떻게 대응할 것인가?
  전직 마왕이 되어 악마와 천사, 그리고 마법과는 거리가 멀거나 마법 그 자체인 온갖 별난 괴짜들을 만나 보자.

